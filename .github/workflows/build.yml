name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # Necesario para que softprops/action-gh-release suba el binario al release
    # (el default del repo es Contents: read)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libegl-dev

      - name: Build
        # estampa la versión del tag (releases) o de la rama en --version
        run: go build -o hydrapotion -ldflags="-s -w -X main.version=${{ github.ref_name }}" .

      - name: Test
        run: go test ./...

      - name: Upload binary (CI)
        uses: actions/upload-artifact@v4
        with:
          name: hydrapotion-linux-amd64
          path: hydrapotion

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: hydrapotion
